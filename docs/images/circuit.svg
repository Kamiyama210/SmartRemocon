<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" font-family="'Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>

  <rect width="760" height="490" fill="#ffffff"/>

  <g stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round">

    <!-- Raspberry Pi Pico 2 W -->
    <rect x="40" y="30" width="190" height="440" fill="#f5f5f5"/>

    <!-- 配線：VBUS → R1 → D1 → Q1 -->
    <path d="M230,80 H480 V95"/>
    <rect x="472" y="95" width="16" height="40" fill="#ffffff"/>
    <path d="M480,135 V150"/>
    <path d="M466,150 H494 L480,172 Z" fill="#ffffff"/>
    <path d="M466,172 H494"/>
    <path d="M480,172 V204 H466"/>
    <path d="M498,156 L518,146" marker-end="url(#arrow)"/>
    <path d="M498,167 L518,157" marker-end="url(#arrow)"/>

    <!-- Q1（NチャネルMOSFET） -->
    <path d="M466,199 V209"/>
    <path d="M466,213 V223"/>
    <path d="M466,227 V237"/>
    <path d="M458,199 V237"/>
    <path d="M480,218 H468" marker-end="url(#arrow)"/>
    <path d="M480,218 V232 H466"/>

    <!-- 配線：GP15 → R2 → ゲート、ゲート → R3 -->
    <path d="M230,218 H300"/>
    <rect x="300" y="210" width="50" height="16" fill="#ffffff"/>
    <path d="M350,218 H458"/>
    <path d="M400,218 V240"/>
    <rect x="392" y="240" width="16" height="40" fill="#ffffff"/>

    <!-- 配線：GND（R3、Q1のソース、BME280のGNDとSDOを、PicoのGNDへ） -->
    <path d="M230,310 H520 V340 H540"/>
    <path d="M400,280 V310"/>
    <path d="M480,232 V310"/>
    <path d="M540,360 H520 V340"/>

    <!-- BME280 -->
    <rect x="540" y="290" width="170" height="170" fill="#f5f5f5"/>
    <path d="M230,380 H540"/>
    <path d="M230,410 H540"/>
    <path d="M230,440 H540"/>
  </g>

  <!-- 接続点 -->
  <g fill="#222">
    <circle cx="400" cy="218" r="3.2"/>
    <circle cx="400" cy="310" r="3.2"/>
    <circle cx="480" cy="310" r="3.2"/>
    <circle cx="520" cy="340" r="3.2"/>
  </g>

  <!-- Picoのピン名 -->
  <g fill="#222">
    <text x="135" y="56" text-anchor="middle" font-weight="bold">Raspberry Pi Pico 2 W</text>
    <text x="222" y="84" text-anchor="end">40　VBUS</text>
    <text x="222" y="222" text-anchor="end">20　GP15</text>
    <text x="222" y="314" text-anchor="end">GND</text>
    <text x="222" y="384" text-anchor="end">36　3V3(OUT)</text>
    <text x="222" y="414" text-anchor="end">6　GP4(SDA)</text>
    <text x="222" y="444" text-anchor="end">7　GP5(SCL)</text>
  </g>

  <!-- 部品の名前と値 -->
  <g fill="#222">
    <text x="340" y="72" text-anchor="middle" fill="#555">VBUS</text>
    <text x="496" y="119">R1　33Ω</text>
    <text x="526" y="160">D1　IR LED（OSI5LA5113A）</text>
    <text x="488" y="203" font-size="11" fill="#555">D</text>
    <text x="446" y="214" font-size="11" fill="#555">G</text>
    <text x="488" y="246" font-size="11" fill="#555">S</text>
    <text x="500" y="222">Q1　2SK4017</text>
    <text x="325" y="203" text-anchor="middle">R2　100Ω</text>
    <text x="384" y="264" text-anchor="end">R3　10kΩ</text>
  </g>

  <!-- BME280のピン名 -->
  <g fill="#222">
    <text x="625" y="314" text-anchor="middle" font-weight="bold">BME280（モジュール）</text>
    <text x="548" y="344">GND</text>
    <text x="548" y="364">SDO</text>
    <text x="548" y="384">VCC</text>
    <text x="548" y="414">SDA</text>
    <text x="548" y="444">SCL</text>
  </g>
</svg>
